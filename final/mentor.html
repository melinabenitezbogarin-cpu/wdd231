<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get a mentor - Be productive not just busy</title>
    <meta name="description" content="You can fill a form to get a mentor in this page">
    <meta name="author" content="Melina Benitez Bogarin">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <link rel="icon" href="images/faviconp.ico">

    <link rel="stylesheet" href="styles/mentor-small.css">
    <link rel="stylesheet" href="styles/mentor-large.css">
    <link rel="stylesheet" href="styles/normalize.css">

    <script src="scripts/mentor.js" defer></script>

    <meta property="og:title" content="Get a mentor - Be productive not just busy">
    <meta property="og:description" content="You can fill a form to get a mentor in this page">
    <meta property="og:image"
        content="https://raw.githubusercontent.com/melinabenitezbogarin-cpu/wdd231/refs/heads/main/final/images/home-beproductive.jpg">
    <meta property="og:url" content="https://melinabenitezbogarin-cpu.github.io/wdd231/final/mentor.html">

</head>

<body>
    <header>
        <div class="header-container">
            <div class="logo">
                <img src="images/faviconp.ico" alt="Balance">
                <div class="title">
                    <h2>Be productive</h2>
                </div>
            </div>

            <nav id="menu">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="learn.html">Learn</a></li>
                    <li><a href="resources.html">Resources</a></li>
                    <li><a href="mentor.html" class="btn-mentor active">Get a Mentor</a></li>
                </ul>
            </nav>

            <div class="header-right">
                <button id="hamburger" aria-label="Toggle Navigation Menu">☰</button>
            </div>
        </div>
    </header>
    <main>
        <h1>Be Productive not just busy</h1>
        <form action="mentorapplied.html" method="get" class="join-form">
            <h2>Have a Mentor this week!</h2>

            <div class="form-group">
                <label for="flname">First and Last Name *</label>
                <input type="text" id="flname" name="flname" required autocomplete="given-name"
                    title="Enter your first and last name">
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" required autocomplete="email" placeholder="john89@gmail.com"
                    title="Enter a valid email address">
            </div>

            <div class="form-group">
                <label for="option-select">Mentor Area</label>
                <select name="option" id="option-select" required>
                    <option value="" disabled selected>Select an option ...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="start-date">Date to Begin</label>
                <input type="date" id="start-date" name="startDate" required>
            </div>

            <div class="form-group">
                <label for="finish-date">Date to Finish</label>
                <input type="date" id="finish-date" name="finishDate" required>
            </div>

            <div class="form-group">
                <label for="written-review">Add specific information you want to focus on... <span
                        class="optional">(Optional)</span></label>
                <textarea name="writtenReview" id="written-review" rows="4"></textarea>
            </div>
            <input type="submit" value="Get a Mentor" class="submit-btn">
        </form>
    </main>
    <footer>
        <div class="footer-content">
            <div class="footer-info">
                <h3>Be productive not just busy</h3>
                <p>Melina Benitez Bogarin</p>
                <p>beproductive@gmail.com</p>
                <p>WDD 231 Project</p>
                <p>&copy;<span id="currentyear"></span> Be productive not just busy</p>
                <p id="lastModified"></p>
            </div>
        </div>
    </footer>
</body>

</html>
